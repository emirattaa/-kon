name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Proje klasörü nerede olursa olsun (kökte ya da alt klasörde) bul ve orada derle
      - name: Build debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)")
          echo "Proje klasörü: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MonoLauncher-debug-apk
          path: "**/app-debug.apk"
